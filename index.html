<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Segment Calculator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #f5f5f5;
    padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 30px; margin: 12px 0 6px; }
  .sub { color: #999; margin-bottom: 28px; }
  label { display: block; margin: 18px 0 8px; font-weight: 600; }
  input {
    width: 100%;
    font-size: 22px;
    padding: 15px 14px;
    border: 1px solid #444;
    border-radius: 12px;
    background: #1d1d1d;
    color: white;
    outline: none;
  }
  input:focus { border-color: #888; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 17px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: #111;
    font-size: 19px;
    font-weight: 700;
  }
  button:active { transform: scale(.99); }
  .result {
    margin-top: 28px;
    padding: 20px;
    border-radius: 14px;
    background: #1d1d1d;
    border: 1px solid #333;
  }
  .row { display: flex; justify-content: space-between; gap: 20px; margin: 12px 0; }
  .value { font-size: 22px; font-weight: 700; }
  .error { color: #ff8f8f; margin-top: 16px; }
  .formula { color: #888; font-size: 13px; line-height: 1.5; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>Segment Calculator</h1>
  <div class="sub">Chord &amp; segment geometry</div>

  <label for="c1">C1 — chord length (mm)</label>
  <input id="c1" type="number" inputmode="decimal" step="any" placeholder="e.g. 100">

  <label for="h1">H1 — segment height (mm)</label>
  <input id="h1" type="number" inputmode="decimal" step="any" placeholder="e.g. 20">

  <label for="c2">C2 — new chord (mm)</label>
  <input id="c2" type="number" inputmode="decimal" step="any" value="100">

  <button onclick="calculate()">CALCULATE</button>

  <div id="error" class="error"></div>

  <div id="result" class="result" hidden>
    <div class="row"><span>Radius R</span><span class="value" id="rOut"></span></div>
    <div class="row"><span>New height H2</span><span class="value" id="h2Out"></span></div>
  </div>

  <div class="formula">
    R = (C1² + 4H1²) / (8H1)<br>
    H2 = R − √(R² − (C2/2)²)
  </div>
</main>

<script>
function calculate() {
  const C1 = Number(document.getElementById('c1').value);
  const H1 = Number(document.getElementById('h1').value);
  const C2 = Number(document.getElementById('c2').value);
  const error = document.getElementById('error');
  const result = document.getElementById('result');

  error.textContent = '';
  result.hidden = true;

  if (!(C1 > 0) || !(H1 > 0) || !(C2 > 0)) {
    error.textContent = 'Please enter positive values for all fields.';
    return;
  }

  if (C2 > 2 * ((C1*C1 + 4*H1*H1) / (8*H1))) {
    error.textContent = 'C2 is too large for this radius.';
    return;
  }

  const R = (C1*C1 + 4*H1*H1) / (8*H1);
  const inside = R*R - (C2/2)*(C2/2);

  if (inside < 0) {
    error.textContent = 'No real solution for H2 with these values.';
    return;
  }

  const H2 = R - Math.sqrt(inside);

  document.getElementById('rOut').textContent = R.toFixed(2) + ' mm';
  document.getElementById('h2Out').textContent = H2.toFixed(2) + ' mm';
  result.hidden = false;
}
</script>
</body>
</html>
