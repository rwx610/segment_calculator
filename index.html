
<div class="section">Circle geometry</div>

<label for="c1">C — Chord length (mm)</label>
<input id="c1" type="number" step="any" placeholder="Enter chord">

<label for="h1">H — Segment height (mm)</label>
<input id="h1" type="number" step="any" placeholder="Enter height">

<label for="r1">R — Radius (mm)</label>
<input id="r1" type="number" step="any" placeholder="Enter radius">

<div id="status" class="status">
  Enter any two parameters.
</div>
<div id="error" class="error"></div>

<script>
const fields = {
  C: document.getElementById('c1'),
  H: document.getElementById('h1'),
  R: document.getElementById('r1')
};

const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');

let anchors = [];

function read(key) {
  const s = fields[key].value.trim();
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function write(key, value) {
  fields[key].value = Number(value.toFixed(4)).toString();
}

function solve(a, b) {
  const x = read(a);
  const y = read(b);

  if (!(x > 0) || !(y > 0)) {
    return { error: 'Both anchor values must be positive.' };
  }

  // C + H -> R
  if ((a === 'C' && b === 'H') ||
      (a === 'H' && b === 'C')) {
    const C = read('C');
    const H = read('H');

    return {
      key: 'R',
      value: C * C / (8 * H) + H / 2
    };
  }

  // C + R -> H
  if ((a === 'C' && b === 'R') ||
      (a === 'R' && b === 'C')) {
    const C = read('C');
    const R = read('R');

    if (C > 2 * R) {
      return { error: 'Chord cannot exceed the diameter (2R).' };
    }

    return {
      key: 'H',
      value: R - Math.sqrt(Math.max(0, R * R - C * C / 4))
    };
  }

  // H + R -> C
  const H = read('H');
  const R = read('R');

  if (H > R) {
    return {
      error: 'For a minor segment, H must not exceed R.'
    };
  }

  return {
    key: 'C',
    value: 2 * Math.sqrt(Math.max(0, 2 * R * H - H * H))
  };
}

function update(changed) {
  errorEl.textContent = '';

  // The edited field becomes an anchor.
  anchors = anchors.filter(k => k !== changed);
  anchors.push(changed);

  // Keep the two most recently edited fields as anchors.
  if (anchors.length > 2) anchors.shift();

  if (anchors.length < 2) {
    statusEl.textContent = 'Enter one more parameter to calculate.';
    return;
  }

  const result = solve(anchors[0], anchors[1]);

  if (result.error) {
    errorEl.textContent = result.error;
    statusEl.textContent = 'Check the anchor values.';
    return;
  }

  write(result.key, result.value);

  statusEl.textContent =
    'Anchors: ' + anchors.join(' + ') +
    ' | Calculated: ' + result.key;
}

Object.keys(fields).forEach(key => {
  fields[key].addEventListener('input', () => update(key));
});
</script>
